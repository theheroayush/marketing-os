name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: pnpm install

    - name: Run Web Build
      run: pnpm run build

    - name: Verify Web Build Artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: 'dist' directory not generated by build.js!"
          exit 1
        fi
        if [ ! -f "dist/index.html" ] || [ ! -f "dist/app.js" ] || [ ! -f "dist/styles.css" ]; then
          echo "Error: Missing critical assets in the dist/ folder!"
          exit 1
        fi

    - name: Capacitor Sync Validation
      run: |
        npx cap add android
        npx cap sync android
